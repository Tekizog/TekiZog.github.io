<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>文章 · 樱花街道</title>
  <meta name="description" content="樱花街道的一篇手记。">
  <meta name="theme-color" content="#fff7f9">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preload" as="image" href="assets/img/poster.webp" media="(min-width: 721px)">
  <link rel="preload" as="image" href="assets/img/poster-sm.webp" media="(max-width: 720px)">
  <link rel="stylesheet" href="assets/css/style.css?v=20261021B">
  <script>
    /* 首帧前恢复主题：夜樱用户刷新时不闪一下昼樱 */
    try {
      var __t = localStorage.getItem("sakura-theme");
      if (!__t && matchMedia("(prefers-color-scheme: dark)").matches) __t = "night";
      if (__t) document.documentElement.setAttribute("data-theme", __t);
    } catch (e) {}
  </script>
  <script defer src="assets/config.js?v=20261020"></script>
  <script defer src="assets/js/marked.min.js"></script>
  <script defer src="assets/js/site.js?v=20261021B"></script>
  <script defer src="assets/js/post.js?v=20261021B"></script>
</head>
<body>

  <canvas id="petals" aria-hidden="true"></canvas>

  <!-- 全站固定动态背景（每个页面都一样，不随滚动消失） -->
  <div class="bg-media" aria-hidden="true">
    <div class="bg-poster"></div>
    <video id="bgVideo" muted loop playsinline preload="none"></video>
  </div>
  <div class="bg-veil" aria-hidden="true"></div>

  <!-- 阅读进度 -->
  <div class="progress" aria-hidden="true"><i id="progressBar"></i></div>

  <!-- 导航 -->
  <header class="nav">
    <a class="nav-logo" href="index.html">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="skPetal" x1="0" y1="0" x2="0.55" y2="1">
            <stop offset="0%" stop-color="#ffd6e5"/>
            <stop offset="45%" stop-color="#ffaacb"/>
            <stop offset="100%" stop-color="#ef6b96"/>
          </linearGradient>
          <radialGradient id="skCore" cx="38%" cy="34%" r="70%">
            <stop offset="0%" stop-color="#ffe9a0"/>
            <stop offset="100%" stop-color="#f7b32b"/>
          </radialGradient>
          <path id="skPetalPath" d="M0 -2.6 C -4.6 -5 -9.2 -10.4 -9.4 -17.8 C -9.5 -22.8 -6.2 -25 -3.2 -24.2 C -1.3 -23.7 -0.5 -22.6 0 -20.6 C 0.5 -22.6 1.3 -23.7 3.2 -24.2 C 6.2 -25 9.5 -22.8 9.4 -17.8 C 9.2 -10.4 4.6 -5 0 -2.6 Z"/>
        </defs>
        <g transform="translate(32,33)" fill="url(#skPetal)">
          <use href="#skPetalPath"/>
          <use href="#skPetalPath" transform="rotate(72)"/>
          <use href="#skPetalPath" transform="rotate(144)"/>
          <use href="#skPetalPath" transform="rotate(216)"/>
          <use href="#skPetalPath" transform="rotate(288)"/>
        </g>
        <circle cx="32" cy="33" r="4.8" fill="url(#skCore)"/>
      </svg>
      <span data-cfg="siteName">樱花街道</span>
    </a>
    <nav class="nav-links">
      <a class="nav-keep" href="index.html">首页</a>
      <a class="nav-keep" href="index.html#posts">手记</a>
      <a class="nav-keep" href="index.html#archive">归档</a>
      <a class="nav-keep" href="index.html#about">关于</a>
      <a id="ghLink" target="_blank" rel="noopener">GitHub</a>
      <button id="themeToggle" aria-label="切换昼夜主题">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="icoSun" cx="42%" cy="38%" r="62%">
              <stop offset="0%" stop-color="#ffefb8"/>
              <stop offset="100%" stop-color="#ffae35"/>
            </radialGradient>
          </defs>
          <circle cx="12" cy="12" r="4.2" fill="url(#icoSun)"/>
          <g stroke="#ffae35" stroke-width="1.7" stroke-linecap="round">
            <path d="M12 2.4v2.1M12 19.5v2.1M2.4 12h2.1M19.5 12h2.1M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M18.8 5.2l-1.5 1.5M6.7 17.3l-1.5 1.5"/>
          </g>
        </svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="icoMoon" cx="40%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#fff6de"/>
              <stop offset="100%" stop-color="#ffc25c"/>
            </radialGradient>
            <mask id="icoMoonMask">
              <rect width="24" height="24" fill="#000"/>
              <circle cx="11.4" cy="12" r="8.4" fill="#fff"/>
              <circle cx="16.2" cy="9.2" r="7.1" fill="#000"/>
            </mask>
          </defs>
          <circle cx="11.4" cy="12" r="8.4" fill="url(#icoMoon)" mask="url(#icoMoonMask)"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- 文章头图（透出全站动态背景；front matter 可用 cover 覆盖） -->
  <div class="post-hero">
    <div class="post-hero-inner">
      <p class="post-kicker">❀ 手 記 ❀</p>
      <p class="post-crumb"><a class="crumb-back" href="index.html#notes">← 返回手记</a></p>
      <h1 id="postTitle">加载中…</h1>
      <div class="post-title-bar" aria-hidden="true"></div>
      <p class="post-meta" id="postMeta"></p>
    </div>
  </div>

  <div class="post-wrap">
    <article class="article" id="postBody">
      <div class="error-panel"><div class="big">🌸</div><h2>正在打开手记…</h2></div>
    </article>

    <div class="post-foot">
      <div class="post-actions">
        <button class="btn btn-ghost" id="copyLink">🔗 复制文章链接</button>
        <a class="btn btn-ghost" href="index.html">🏠 回到首页</a>
      </div>
      <nav class="post-nav" id="postNav"></nav>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-divider">❀ ❀ ❀</div>
    <p class="footer-jp" data-cfg="jpName">桜の街道</p>
    <p><span data-cfg="footer">© 2026 樱花街道 · Sakura Street</span></p>
  </footer>

  <div class="toast" id="toast" role="status">已复制</div>

</body>
</html>
