<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>樱花街道 · 桜の街道</title>
  <meta name="description" content="把日常写成诗，落在樱花飘落的街角。一个二次元风格的个人博客。">
  <meta name="theme-color" content="#fff7f9">
  <meta property="og:type" content="website">
  <meta property="og:title" content="樱花街道 · 桜の街道">
  <meta property="og:description" content="把日常写成诗，落在樱花飘落的街角。">
  <meta property="og:image" content="assets/img/poster.jpg">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preload" as="image" href="assets/img/poster.webp" media="(min-width: 721px)">
  <link rel="preload" as="image" href="assets/img/poster-sm.webp" media="(max-width: 720px)">
  <link rel="stylesheet" href="assets/css/style.css?v=20261020T">
  <script>
    /* 首帧前恢复主题：夜樱用户刷新时不闪一下昼樱 */
    try {
      var __t = localStorage.getItem("sakura-theme");
      if (!__t && matchMedia("(prefers-color-scheme: dark)").matches) __t = "night";
      if (__t) document.documentElement.setAttribute("data-theme", __t);
    } catch (e) {}
  </script>
  <script defer src="assets/config.js?v=20261020"></script>
  <script defer src="assets/js/site.js?v=20261020T"></script>
</head>
<body class="home">
  <script>
    /* 首帧前恢复视图状态：从手记/关于页刷新时直接落在对应视图，
       避免先画封面、再等 JS 切换造成整页滑动的闪烁。
       #posts 是文章页「手记」链接的锚点，等同 #notes */
    (function () {
      var h = location.hash;
      if (h === "#notes" || h === "#posts") document.body.classList.add("at-notes");
      else if (h === "#about") document.body.classList.add("at-about");
    })();
  </script>

  <!-- 樱花飘落画布 -->
  <canvas id="petals" aria-hidden="true"></canvas>

  <!-- 全站固定动态背景（每个页面都一样，不随滚动消失） -->
  <div class="bg-media" aria-hidden="true">
    <div class="bg-poster"></div>
    <video id="bgVideo" muted loop playsinline preload="none"></video>
  </div>
  <div class="bg-veil" aria-hidden="true"></div>

  <!-- 导航 -->
  <header class="nav">
    <a class="nav-logo" href="index.html">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="skPetal" x1="0" y1="0" x2="0.55" y2="1">
            <stop offset="0%" stop-color="#ffd6e5"/>
            <stop offset="45%" stop-color="#ffaacb"/>
            <stop offset="100%" stop-color="#ef6b96"/>
          </linearGradient>
          <radialGradient id="skCore" cx="38%" cy="34%" r="70%">
            <stop offset="0%" stop-color="#ffe9a0"/>
            <stop offset="100%" stop-color="#f7b32b"/>
          </radialGradient>
          <path id="skPetalPath" d="M0 -2.6 C -4.6 -5 -9.2 -10.4 -9.4 -17.8 C -9.5 -22.8 -6.2 -25 -3.2 -24.2 C -1.3 -23.7 -0.5 -22.6 0 -20.6 C 0.5 -22.6 1.3 -23.7 3.2 -24.2 C 6.2 -25 9.5 -22.8 9.4 -17.8 C 9.2 -10.4 4.6 -5 0 -2.6 Z"/>
        </defs>
        <g transform="translate(32,33)" fill="url(#skPetal)">
          <use href="#skPetalPath"/>
          <use href="#skPetalPath" transform="rotate(72)"/>
          <use href="#skPetalPath" transform="rotate(144)"/>
          <use href="#skPetalPath" transform="rotate(216)"/>
          <use href="#skPetalPath" transform="rotate(288)"/>
        </g>
        <circle cx="32" cy="33" r="4.8" fill="url(#skCore)"/>
      </svg>
      <span data-cfg="siteName">樱花街道</span>
    </a>
    <nav class="nav-links">
      <a class="nav-keep is-active" href="index.html" data-nav="cover">首页</a>
      <a class="nav-keep" href="#posts" data-nav="notes">手记</a>
      <a class="nav-keep" href="#archive" data-nav="archive">归档</a>
      <a class="nav-keep" href="#about" data-nav="about">关于</a>
      <a id="ghLink" target="_blank" rel="noopener">GitHub</a>
      <button id="themeToggle" aria-label="切换昼夜主题">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="icoSun" cx="42%" cy="38%" r="62%">
              <stop offset="0%" stop-color="#ffefb8"/>
              <stop offset="100%" stop-color="#ffae35"/>
            </radialGradient>
          </defs>
          <circle cx="12" cy="12" r="4.2" fill="url(#icoSun)"/>
          <g stroke="#ffae35" stroke-width="1.7" stroke-linecap="round">
            <path d="M12 2.4v2.1M12 19.5v2.1M2.4 12h2.1M19.5 12h2.1M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M18.8 5.2l-1.5 1.5M6.7 17.3l-1.5 1.5"/>
          </g>
        </svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true">
          <defs>
            <radialGradient id="icoMoon" cx="40%" cy="30%" r="80%">
              <stop offset="0%" stop-color="#fff6de"/>
              <stop offset="100%" stop-color="#ffc25c"/>
            </radialGradient>
            <mask id="icoMoonMask">
              <rect width="24" height="24" fill="#000"/>
              <circle cx="11.4" cy="12" r="8.4" fill="#fff"/>
              <circle cx="16.2" cy="9.2" r="7.1" fill="#000"/>
            </mask>
          </defs>
          <circle cx="11.4" cy="12" r="8.4" fill="url(#icoMoon)" mask="url(#icoMoonMask)"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- 封面视图（独立页面） -->
  <section class="hero view-cover" id="viewCover">
    <div class="hero-side" data-cfg="sideText">桜舞う街角、物語は続く。</div>

    <div class="hero-content">
      <p class="hero-kicker" data-cfg="jpName">桜の街道</p>
      <h1 class="hero-title" data-cfg="siteName">樱花街道</h1>
      <p class="hero-tagline" data-cfg="tagline">把日常写成诗，落在樱花飘落的街角。</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#posts" data-nav="notes">❀ 开始阅读</a>
        <a class="btn btn-ghost" href="#about" data-nav="about">关于这条街</a>
      </div>
    </div>

    <a class="scroll-hint" href="#posts" data-nav="notes"><span>DRAG ↑</span><i></i></a>
  </section>

  <!-- 手记视图（独立页面，内部滚动） -->
  <div class="view view-notes" id="viewNotes">
  <main>
    <!-- 文章列表 -->
    <section class="section" id="posts">
      <div class="section-head reveal">
        <p class="section-jp">さいきんのてがき</p>
        <h2 class="section-title">最新手记</h2>
      </div>

      <!-- 工具栏与时间筛选独立成行（横跨两栏），分类栏从卡片那一行才开始 -->
      <div class="notes-wrap">
        <div class="toolbar reveal">
          <div class="toolbar-info">
            <span class="cat-current" id="catCurrent" aria-live="polite">全部</span>
            <button class="filter-clear" id="filterClear" type="button" hidden>清除筛选</button>
          </div>
          <div class="tools">
            <button class="tool-btn" id="sortToggle" type="button" title="切换排序方式">最新 ↓</button>
            <input id="search" class="search" type="search" placeholder="🔍 搜索文章…" aria-label="搜索文章">
          </div>
        </div>

        <!-- 时间范围筛选：点整块日期框打开自绘日历，选完点「应用」才生效 -->
        <div class="date-bar reveal" id="dateBar" role="group" aria-label="按时间范围筛选">
          <p class="db-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3.2" y="5" width="17.6" height="15.8" rx="3"/>
              <path d="M3.2 9.6h17.6M8.2 3.4v3.2M15.8 3.4v3.2"/>
            </svg>
            时间范围
          </p>
          <div class="db-field">
            <span id="lbFrom">开始日期</span>
            <button class="db-trigger" id="dateFrom" type="button"
                    aria-haspopup="dialog" aria-expanded="false" aria-labelledby="lbFrom">
              <span class="db-val is-empty">yyyy/mm/dd</span>
              <svg class="db-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.2" y="5" width="17.6" height="15.8" rx="3"/>
                <path d="M3.2 9.6h17.6M8.2 3.4v3.2M15.8 3.4v3.2"/>
              </svg>
            </button>
          </div>
          <span class="db-arrow" aria-hidden="true">→</span>
          <div class="db-field">
            <span id="lbTo">结束日期</span>
            <button class="db-trigger" id="dateTo" type="button"
                    aria-haspopup="dialog" aria-expanded="false" aria-labelledby="lbTo">
              <span class="db-val is-empty">yyyy/mm/dd</span>
              <svg class="db-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.2" y="5" width="17.6" height="15.8" rx="3"/>
                <path d="M3.2 9.6h17.6M8.2 3.4v3.2M15.8 3.4v3.2"/>
              </svg>
            </button>
          </div>

          <div class="db-actions">
            <span class="db-hint" id="dateHint"></span>
            <button class="db-reset" id="dateReset" type="button" hidden>重置</button>
            <button class="db-apply" id="dateApply" type="button" disabled>应用</button>
          </div>
        </div>

        <div class="notes-layout">
          <aside class="cat-rail reveal" id="catRail" aria-label="文章分类"></aside>
          <div class="grid" id="postGrid"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="footer-divider">❀ ❀ ❀</div>
    <p class="footer-jp" data-cfg="jpName">桜の街道</p>
    <p><span data-cfg="footer">© 2026 樱花街道 · Sakura Street</span></p>
  </footer>
  </div>

  <!-- 归档视图（独立页面） -->
  <div class="view view-archive" id="viewArchive">
    <section class="section">
      <div class="section-head reveal in">
        <p class="section-jp">すべてのてがき</p>
        <h2 class="section-title">归档</h2>
      </div>
      <div class="toolbar reveal in">
        <div class="year-bar" id="yearBar"></div>
        <div class="tools">
          <button class="tool-btn" id="arcSortToggle" type="button" title="切换排序方式">最新 ↓</button>
        </div>
      </div>
      <div class="archive" id="archive"></div>
    </section>
  </div>

  <!-- 关于视图（独立页面） -->
  <div class="view view-about" id="viewAbout">
    <section class="section" id="about">
      <div class="section-head reveal in">
        <p class="section-jp">この街について</p>
        <h2 class="section-title">关于</h2>
      </div>
      <div class="about-box reveal in">
        <div class="avatar" aria-hidden="true">
          <svg viewBox="0 0 64 64">
            <defs>
              <linearGradient id="avPetal" x1="0" y1="0" x2="0.52" y2="1">
                <stop offset="0%" stop-color="#fff2f7"/>
                <stop offset="34%" stop-color="#ffb8d3"/>
                <stop offset="100%" stop-color="#ec6492"/>
              </linearGradient>
              <radialGradient id="avCore" cx="36%" cy="30%" r="74%">
                <stop offset="0%" stop-color="#fff6cd"/>
                <stop offset="52%" stop-color="#ffd15f"/>
                <stop offset="100%" stop-color="#ef9d16"/>
              </radialGradient>
              <path id="avPetalPath" d="M0 -3 C -4 -6.4 -7.6 -11.8 -8.4 -17.6 C -9.2 -23.4 -6.8 -25.6 -4.2 -25.3 C -2 -25.1 -0.8 -23.8 0 -21.4 C 0.8 -23.8 2 -25.1 4.2 -25.3 C 6.8 -25.6 9.2 -23.4 8.4 -17.6 C 7.6 -11.8 4 -6.4 0 -3 Z"/>
            </defs>
            <g transform="translate(32,33)">
              <!-- 五片花瓣：尖端留豁口（真樱花的特征），整体微转一点，不至于太像图标 -->
              <g transform="rotate(-9)" fill="url(#avPetal)" stroke="rgba(255,255,255,0.35)" stroke-width="0.5">
                <use href="#avPetalPath"/>
                <use href="#avPetalPath" transform="rotate(72)"/>
                <use href="#avPetalPath" transform="rotate(144)"/>
                <use href="#avPetalPath" transform="rotate(216)"/>
                <use href="#avPetalPath" transform="rotate(288)"/>
              </g>
              <!-- 花蕊：八根花丝 + 顶端花药 -->
              <g stroke="#ffd88a" stroke-width="0.8" stroke-linecap="round" opacity="0.8">
                <path d="M0 0 L0 -9.2"/>
                <path d="M0 0 L6.5 -6.5"/>
                <path d="M0 0 L9.2 0"/>
                <path d="M0 0 L6.5 6.5"/>
                <path d="M0 0 L0 9.2"/>
                <path d="M0 0 L-6.5 6.5"/>
                <path d="M0 0 L-9.2 0"/>
                <path d="M0 0 L-6.5 -6.5"/>
              </g>
              <g fill="#fff6cf">
                <circle cx="0" cy="-9.5" r="0.95"/>
                <circle cx="6.7" cy="-6.7" r="0.95"/>
                <circle cx="9.5" cy="0" r="0.95"/>
                <circle cx="6.7" cy="6.7" r="0.95"/>
                <circle cx="0" cy="9.5" r="0.95"/>
                <circle cx="-6.7" cy="6.7" r="0.95"/>
                <circle cx="-9.5" cy="0" r="0.95"/>
                <circle cx="-6.7" cy="-6.7" r="0.95"/>
              </g>
              <circle r="4.7" fill="url(#avCore)"/>
              <circle r="4.7" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.7"/>
            </g>
          </svg>
        </div>
        <div class="about-text">
          <h3 data-cfg="aboutTitle">关于这条街</h3>
          <p data-cfg="about">你好，欢迎来到「樱花街道」。</p>
        </div>
      </div>

      <!-- 背景视频出处（B站）：链接卡片，不内嵌播放器 -->
      <a class="video-credit reveal in" href="https://www.bilibili.com/video/BV1Go5N66E8T" target="_blank" rel="noopener"
         title="在 B 站观看这条视频">
        <span class="vc-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3.5 10.2 7M17 3.5 13.8 7"/>
            <rect x="3" y="7" width="18" height="12.5" rx="3.2"/>
            <path d="M9 11.5v3.2M15 11.5v3.2"/>
          </svg>
        </span>
        <span class="vc-text">
          <b>背景视频出处 · 樱花街道</b>
          <i>动态背景来自 B 站的这段视频，感谢作者分享的动态背景</i>
        </span>
        <span class="vc-go">前往观看 →</span>
      </a>
    </section>
  </div>

  <!-- 自绘日历弹层：挂在 body 上 + fixed 定位。
       放在筛选条里会被卡片（transform / backdrop-filter 各自成层）盖住，
       祖先一旦有 transform 还会让 fixed 失效，所以必须提到最外层 -->
  <div class="dp" id="datePicker" role="dialog" aria-modal="false" aria-label="选择日期" hidden>
    <div class="dp-head">
      <button class="dp-nav" type="button" data-step="-1" aria-label="上个月">‹</button>
      <p class="dp-month" id="dpMonth" aria-live="polite">2026 年 9 月</p>
      <button class="dp-nav" type="button" data-step="1" aria-label="下个月">›</button>
    </div>
    <div class="dp-week" aria-hidden="true">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="dp-grid" id="dpGrid"></div>
    <div class="dp-foot">
      <button class="dp-link" type="button" data-dp="clear">清除</button>
      <button class="dp-link" type="button" data-dp="today">今天</button>
    </div>
  </div>

</body>
</html>
